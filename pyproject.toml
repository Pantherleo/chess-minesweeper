[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-minesweeper"
version = "0.1.0"
description = "A desktop chess variant with hidden mines and three king lives."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["chess==1.11.2", "pygame==2.6.1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
chess-minesweeper = "chess_minesweeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".conda", "experiments", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
